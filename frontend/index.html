  charset="utf-8"
/><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
  知华 DataMask</title
><style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #f4f6f5;
    color: #203029;
    font:
      14px "PingFang SC",
      sans-serif;
  }
  header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #dde5e0;
    padding: 0 5vw;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  header b {
    color: #167b55;
  }
  header a {
    margin-left: auto;
    color: #167b55;
  }
  main {
    max-width: 1040px;
    margin: 30px auto;
    padding: 0 18px;
  }
  .card {
    background: #fff;
    border: 1px solid #dae3de;
    border-radius: 10px;
    padding: 22px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th,
  td {
    text-align: left;
    padding: 13px;
    border-bottom: 1px solid #e7ece9;
  }
  input,
  select {
    padding: 9px;
    border: 1px solid #ccd8d1;
    border-radius: 5px;
  }
  button {
    margin-top: 18px;
    padding: 11px 20px;
    border: 0;
    border-radius: 6px;
    background: #167b55;
    color: #fff;
  }
  pre {
    background: #eef5f1;
    padding: 16px;
    border-radius: 7px;
    white-space: pre-wrap;
  }
</style>
<header>
  <b>ZhuaTech DataMask</b><span>安全脱敏预览</span
  ><a href="https://www.zhuatech.cn/">知华科技</a>
</header>
<main>
  <div class="card">
    <table>
      <tbody>
        <tr>
          <th>字段</th>
          <th>类型</th>
          <th>示例值</th>
        </tr>
        <tr>
          <td>mobile</td>
          <td>PHONE</td>
          <td><input type="tel" id="phone" value="13812345678" /></td>
        </tr>
        <tr>
          <td>email</td>
          <td>EMAIL</td>
          <td><input type="email" id="mail" value="demo@zhuatech.cn" /></td>
        </tr>
      </tbody>
    </table>
    <button type="button" id="run">生成脱敏预览</button>
    <pre id="out">结果不会写入浏览器存储</pre>
  </div>
</main>
<script>
  run.onclick = async () => {
    try {
      const r = await fetch("/api/datamask/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fields: [
            { name: "mobile", type: "PHONE", value: phone.value },
            { name: "email", type: "EMAIL", value: mail.value },
          ],
        }),
      }).then((x) => x.json());
      out.textContent =
        r.fields.map((x) => x.name + "  " + x.maskedValue).join("\n") +
        "\n\n覆盖率 " +
        r.coverage +
        "%";
    } catch (e) {
      out.textContent = "请启动后端服务";
    }
  };
</script>
